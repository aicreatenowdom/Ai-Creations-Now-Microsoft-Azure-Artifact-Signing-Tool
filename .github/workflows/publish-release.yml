name: Publish verified Azure Signing Tool release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-release.yml
      - RELEASE.md

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the official executable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --output AI_Creations_Now_Azure_Signing_Tool_v1.0.21_x64.exe \
            https://download.aicreatenow.com/software/AI_Creations_Now_Azure_Signing_Program_1_012.exe

      - name: Verify exact SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo "f34a2f9ae1d9589e83b865fef12bd11085e591ba4626d6bf6325a7fa23372499  AI_Creations_Now_Azure_Signing_Tool_v1.0.21_x64.exe" | sha256sum --check --strict

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          # AI Creations Now Azure Signing Tool 1.0.21

          Free portable Windows x64 GUI for customers who already use Microsoft Azure Artifact Signing.

          ## Integrity

          ```text
          File: AI_Creations_Now_Azure_Signing_Tool_v1.0.21_x64.exe
          Size: 162,974,672 bytes
          SHA-256: F34A2F9AE1D9589E83B865FEF12BD11085E591BA4626D6BF6325A7FA23372499
          ```

          Download only from this release or the official AI Creations Now host. A new or low-reputation download may trigger Microsoft SmartScreen or browser reputation warnings; verify the SHA-256 before execution.
          NOTES

          if gh release view v1.0.21 >/dev/null 2>&1; then
            gh release upload v1.0.21 AI_Creations_Now_Azure_Signing_Tool_v1.0.21_x64.exe --clobber
            gh release edit v1.0.21 --title "Azure Signing Tool 1.0.21" --notes-file release-notes.md --latest
          else
            gh release create v1.0.21 AI_Creations_Now_Azure_Signing_Tool_v1.0.21_x64.exe \
              --title "Azure Signing Tool 1.0.21" \
              --notes-file release-notes.md \
              --latest
          fi
