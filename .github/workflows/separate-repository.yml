name: One-time Azure Signing Tool repository separation

on:
  push:
    paths:
      - .github/workflows/separate-repository.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace repository with dedicated Azure Signing Tool content
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf .
          git clean -fdx
          cat > /tmp/repository-payload.b64 <<'PAYLOAD'

PAYLOAD
          base64 --decode /tmp/repository-payload.b64 | tar -xz
          git add -A
          git config user.name "AI Creations Now Repository Automation"
          git config user.email "dvs32@icloud.com"
          git commit -m "Separate Azure Signing Tool into its dedicated repository"
          git push origin HEAD:main
