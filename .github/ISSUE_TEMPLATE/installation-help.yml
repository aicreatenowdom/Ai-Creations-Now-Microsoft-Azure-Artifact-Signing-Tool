name: Installation or prerequisite help
description: Request help with System Readiness or a Microsoft prerequisite.
title: "[Setup] "
labels: ["setup"]
body:
  - type: input
    id: component
    attributes:
      label: Component or stage that failed
      placeholder: Artifact Signing Client Tools
    validations:
      required: true
  - type: input
    id: exitcode
    attributes:
      label: Installer exit code, if shown
      placeholder: 1603
  - type: textarea
    id: details
    attributes:
      label: Sanitized details
      description: Include the Windows edition/build and the exact non-sensitive message shown by the application.
    validations:
      required: true
  - type: checkboxes
    id: admin
    attributes:
      label: Confirmation
      options:
        - label: I ran the application as an administrator.
          required: true
        - label: I did not include passwords, MFA codes, Azure tokens, tenant secrets, or private customer files.
          required: true
