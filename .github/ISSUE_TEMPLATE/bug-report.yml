name: Bug or compatibility report
description: Report a reproducible product, setup, or Windows compatibility problem.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, MFA codes, Azure tokens, tenant secrets, customer files, or private identity documents.
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: 1.0.21
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows edition and build
      placeholder: Windows 11 Pro 24H2, build 26100
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Workflow stage
      options:
        - Privacy agreement
        - System Readiness / prerequisite setup
        - Microsoft sign-in
        - Azure resource discovery
        - File selection and backup
        - Signing and timestamping
        - Windows verification
        - PDF report
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include sanitized error text and exact steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety confirmation
      options:
        - label: I removed passwords, MFA codes, Azure tokens, tenant secrets, personal identity documents, and confidential file data.
          required: true
